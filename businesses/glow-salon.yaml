# Business template: one file = one business. Fictional data for building and tests.
business_id: glow-salon
name: Glow Salon
type: salon                      # clinic | salon | pg
address: "12, 100 Feet Road, Indiranagar, Bengaluru 560038"
timezone: Asia/Kolkata
phone_numbers: ["+91 80 0000 0001"]   # numbers that forward to this business (fake)

languages:
  default: en
  allowed: [en, hi]
greeting:
  en: "Hello, Glow Salon. I'm the salon's assistant, and this call may be recorded. How can I help you?"
  hi: "Namaste, Glow Salon. Main salon ki assistant hoon, aur yeh call record ho sakti hai. Main aapki kya madad kar sakti hoon?"

# Opening hours per weekday, in local time. A day with no entry is closed.
hours:
  mon: [["10:00", "20:00"]]
  tue: [["10:00", "20:00"]]
  wed: [["10:00", "20:00"]]
  thu: [["10:00", "20:00"]]
  fri: [["10:00", "20:00"]]
  sat: [["09:00", "21:00"]]
  sun: [["10:00", "14:00"]]

services:
  - {id: haircut-men,   name: "Men's haircut",   duration_min: 30, price_inr: 300}
  - {id: haircut-women, name: "Women's haircut", duration_min: 45, price_inr: 600}
  - {id: hair-colour,   name: "Hair colour",     duration_min: 90, price_inr: 1800}
  - {id: facial,        name: "Facial",          duration_min: 60, price_inr: 1200}
  - {id: manicure,      name: "Manicure",        duration_min: 30, price_inr: 500}

staff:
  - {id: ravi,  name: Ravi,  services: [haircut-men, haircut-women, hair-colour]}
  - {id: meena, name: Meena, services: [haircut-women, hair-colour, facial, manicure]}

faqs:
  - {q: "Where is the salon?", a: "12, 100 Feet Road, Indiranagar, near the Metro station."}
  - {q: "Is there parking?", a: "Two-wheeler parking in front; cars park on the side road."}
  - {q: "Do you take card or UPI?", a: "Yes: cash, card and UPI."}
  - {q: "Do you take walk-ins?", a: "Yes, if a stylist is free, but booking is recommended on weekends."}

rules:
  slot_step_min: 15          # bookings start on a 15-minute grid
  min_notice_min: 60         # no bookings starting within the next hour
  max_days_ahead: 14         # no bookings more than two weeks ahead

owner:
  name: Anita
  phone: "+91 90000 00001"   # fake

safety:
  emergency_check: false     # true only for clinic configs (D53)
