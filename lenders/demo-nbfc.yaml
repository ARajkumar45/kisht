# A fictional lender. Every limit the policy guard enforces comes from here, not from code.
id: demo-nbfc
name: Demo Finance Ltd (fictional NBFC)
agent_name: Asha
agent_gender: female        # Hindi verb forms differ by gender
timezone: Asia/Kolkata
languages: {allowed: [en, hi, ta, te], default: hi}

contact:
  window: {start: "08:00", end: "19:00"}   # RBI recovery-agent rules: no calls before 8 am / after 7 pm
  max_attempts_per_day: 2
  max_attempts_per_week: 6
  channels: [chat, voice]

promises:
  max_days_after_due: 7          # promise date <= EMI due date + 7 days (or today + 7 if already overdue)
  min_part_payment_pct: 25       # a part payment must be at least 25% of the amount due
  max_open_promises: 1

needs_human:                     # the agent may only escalate these; never decide them
  - waiver
  - settlement
  - restructure
  - dispute
  - hardship
  - bereavement

banned_phrases:                  # blocked in anything the agent says (threats, shaming)
  - police
  - jail
  - legal action today
  - we will tell your family
  - we will tell your employer
  - property seize
  - ghar aa jayenge
  - badnaam

escalation_desk: "Demo Finance collections desk, weekdays 10:00-18:00"

desk_teams:                      # which human team picks up each kind of hand-off
  hardship: Hardship team
  bereavement: Hardship team
  dispute: Disputes team
  waiver: Collections manager
  settlement: Collections manager
  restructure: Collections manager
  wrong_person: Data quality
  supervisor_takeover: Collections desk
  default: Collections desk

desk_sla_hours:                  # how long the human desk has to resolve each kind of case
  supervisor_takeover: 1         # the borrower is waiting right now
  hardship: 4
  bereavement: 4
  dispute: 24
  default: 48
# qa_scorecard: the default collections scorecard (src/kisht/lender.py) unless set here
