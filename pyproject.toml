[project]
name = "kisht"
version = "0.1.0"
description = "EMI repayment agent for Indian lenders: plans, talks (voice + chat, Hindi/English), and is guarded by code"
readme = "README.md"
authors = [
    { name = "Raj Kumar Arumugam", email = "armugamvrajkumar121@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
kisht = "kisht.cli:main"
receptionist = "receptionist.cli:main"   # old salon CLI, removed after step 4

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: needs the local model server on port 8080 (run with: pytest -m live)"]

[tool.ruff]
line-length = 100

[tool.uv.build-backend]
# receptionist (the M1-M5 salon code) stays until the kisht core replaces it in step 4.
module-name = ["kisht", "receptionist"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
