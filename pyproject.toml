[project]
name = "kisht"
version = "0.1.0"
description = "EMI repayment agent for Indian lenders: plans, talks (voice + chat, Hindi/English/Tamil/Telugu), and is guarded by code"
readme = "README.md"
authors = [
    { name = "Raj Kumar Arumugam", email = "armugamvrajkumar121@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
kisht = "kisht.cli:main"

[project.optional-dependencies]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: needs the local model server (run with: pytest -m live)"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
